name: Collect DX Metrics

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Install project npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - run: npm ci

      - name: Check collector, history, and site
        run: npm run check

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Validate collected data and build
        run: npm run validate:data && npm run build

      - name: Commit and push if changed
        run: |
          if git diff --quiet data/metrics.yaml 2>/dev/null; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics.yaml
          git commit -m "chore: collect dx metrics for $(date +%Y-%m-%d)"
          git push
